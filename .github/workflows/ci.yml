name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-rename-lock:
    name: Windows Rename Lock
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test test/windows-rename.test.ts test/diagnostics.test.ts test/state-concurrency.test.ts test/state-lock.test.ts test/package.test.ts
        env:
          OPENCODE_REQUIRE_WINDOWS_TEST: "1"

  node-runtime:
    name: Node Runtime (${{ matrix.node }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test test/package.test.ts test/state-concurrency.test.ts test/state-lock.test.ts
        env:
          OPENCODE_GOAL_STATE_PATH: ${{ runner.temp }}/goal-runtime/goals.json
          XDG_DATA_HOME: ${{ runner.temp }}/goal-runtime/xdg

  typecheck:
    name: Typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test-coverage:
    name: Tests & Coverage
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: |
          bun run test:coverage 2>&1 | tee test-output.log
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage"
            echo ""
            echo '```'
            awk '/^-+\|/{table=1} table{print}' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate publish Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run pack:dry-run
      - name: Validate artifact upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-build
          path: dist/server.js
          if-no-files-found: error
          retention-days: 1

  tui-compatibility:
    name: TUI Compatibility (${{ matrix.peer }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        peer: [minimum, host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Install matching TUI pair
        env:
          TUI_PEER: ${{ matrix.peer }}
        run: |
          if [ "$TUI_PEER" = host ]; then
            version=$(node -p 'require("./node_modules/@opencode/theme/package.json").dependencies["@opentui/core"]')
          else
            version=0.5.8
          fi
          bun add --dev --exact "@opentui/core@$version" "@opentui/solid@$version"
      - run: bun test test/tui.test.ts test/tui-v2.test.ts
        env:
          OPENCODE_TEST_HOST_THEME: ${{ matrix.peer == 'host' && '1' || '0' }}

  v2-smoke:
    name: V2 Lifecycle Smoke (${{ matrix.channel }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install OpenCode V2
        env:
          OPENCODE_CHANNEL: ${{ matrix.channel }}
        run: |
          if [ "$OPENCODE_CHANNEL" = pinned ]; then
            version=$(node -p 'require("./package.json").devDependencies["@opencode/plugin"]')
          else
            version=beta
          fi
          npm install -g "@opencode/cli@$version"
      - run: bun run smoke:v2
        env:
          OPENCODE_SMOKE_TIMEOUT_MS: "120000"
          OPENCODE_SMOKE_ARTIFACTS_DIR: ${{ runner.temp }}/smoke-artifacts
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-smoke-artifacts-${{ matrix.channel }}
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
