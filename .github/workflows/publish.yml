name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  tui-compatibility:
    name: TUI Compatibility (${{ matrix.peer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        peer: [minimum, host]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Install matching TUI pair
        env:
          TUI_PEER: ${{ matrix.peer }}
        run: |
          if [ "$TUI_PEER" = host ]; then
            version=$(node -p 'require("./node_modules/@opencode/theme/package.json").dependencies["@opentui/core"]')
          else
            version=0.5.8
          fi
          bun add --dev --exact "@opentui/core@$version" "@opentui/solid@$version"
      - run: bun test test/tui.test.ts test/tui-v2.test.ts
        env:
          OPENCODE_TEST_HOST_THEME: ${{ matrix.peer == 'host' && '1' || '0' }}

  v2-smoke:
    name: V2 Lifecycle Smoke
    runs-on: ubuntu-latest
    outputs:
      cli_version: ${{ steps.opencode.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install OpenCode V2
        id: opencode
        run: |
          version=$(node -p 'require("./package.json").devDependencies["@opencode/plugin"]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm install -g "@opencode/cli@$version"
      - run: bun run smoke:v2
        env:
          OPENCODE_SMOKE_TIMEOUT_MS: "120000"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - unit-tests
      - tui-compatibility
      - v2-smoke
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run ci:version
      - name: Read publish version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - run: bun run build
      - run: bun run pack:dry-run
      - run: npm publish --ignore-scripts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_VERSION: ${{ needs.v2-smoke.outputs.cli_version }}
        run: |
          cat > release-notes.md <<EOF
          Published npm version: @prevalentware/opencode-goal-plugin@${VERSION}

          Validation:
          - Typecheck passed.
          - Lint passed.
          - Unit tests passed.
          - V2 lifecycle smoke passed against @opencode/cli@${OPENCODE_VERSION}.
          - Minimum and host OpenTUI compatibility passed.
          - Package published to npm.
          EOF

          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
